<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Anniversaries integration for Gladys Assistant
       (illustration). Built into cover.jpg by scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4e8"/>
      <stop offset="1" stop-color="#ffe1e6"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2545f"/>
      <stop offset="1" stop-color="#c63c4a"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a7bd5"/>
      <stop offset="1" stop-color="#2a5ea8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#bg)"/>

  <!-- confetti -->
  <g opacity="0.85">
    <rect x="70" y="60" width="14" height="6" rx="2" fill="#f4b400" transform="rotate(25 77 63)"/>
    <rect x="690" y="80" width="16" height="6" rx="2" fill="#3a7bd5" transform="rotate(-30 698 83)"/>
    <rect x="620" y="440" width="14" height="6" rx="2" fill="#e2545f" transform="rotate(40 627 443)"/>
    <rect x="110" y="450" width="16" height="6" rx="2" fill="#2fa36b" transform="rotate(-15 118 453)"/>
    <circle cx="160" cy="120" r="6" fill="#e2545f"/>
    <circle cx="730" cy="300" r="5" fill="#f4b400"/>
    <circle cx="60" cy="300" r="5" fill="#3a7bd5"/>
    <circle cx="560" cy="70" r="4" fill="#2fa36b"/>
  </g>

  <!-- calendar page -->
  <g transform="translate(150 110)">
    <rect x="6" y="10" width="300" height="300" rx="28" fill="#000" opacity="0.08"/>
    <rect width="300" height="300" rx="28" fill="#ffffff"/>
    <path d="M0 28 a28 28 0 0 1 28 -28 h244 a28 28 0 0 1 28 28 v62 h-300z" fill="url(#head)"/>
    <rect x="70" y="-22" width="20" height="52" rx="10" fill="#7a1f2a"/>
    <rect x="210" y="-22" width="20" height="52" rx="10" fill="#7a1f2a"/>
    <text x="150" y="70" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" letter-spacing="4">DEC</text>
    <text x="150" y="245" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="140" font-weight="bold" fill="#2b2f3a">24</text>
  </g>

  <!-- gift -->
  <g transform="translate(470 230)">
    <rect x="6" y="66" width="190" height="150" rx="14" fill="#000" opacity="0.08"/>
    <rect y="60" width="190" height="150" rx="14" fill="url(#box)"/>
    <rect x="-12" y="30" width="214" height="46" rx="10" fill="#4d8ee6"/>
    <rect x="80" y="30" width="30" height="180" fill="#f4b400"/>
    <path d="M95 30 C60 -20 20 0 45 25 C55 33 80 32 95 30z" fill="#f4b400"/>
    <path d="M95 30 C130 -20 170 0 145 25 C135 33 110 32 95 30z" fill="#f4b400"/>
  </g>

  <!-- countdown badge -->
  <g transform="translate(520 120)">
    <rect width="170" height="64" rx="32" fill="#2fa36b"/>
    <text x="85" y="43" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">− 7</text>
  </g>

  <text x="400" y="490" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="bold" fill="#2b2f3a">Anniversaries · Gladys Assistant</text>
</svg>
